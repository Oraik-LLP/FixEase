name: fixease
description: FixEase car diagnostic app
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  http: ^1.2.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.3
  camera: ^0.12.0+1
  record: ^6.2.0
  audioplayers: ^6.6.0
  flutter_tts: ^4.2.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.4
  open_filex: ^4.5.0
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.9.0+3
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  purchases_flutter: ^8.10.1
  flutter_image_compress: ^2.4.0
  in_app_review: ^2.0.10
  url_launcher: ^6.3.1
  ntp: ^2.0.0
  bluetooth_serial_android: ^1.1.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo/fixease_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#111114"
  adaptive_icon_foreground: "assets/logo/fixease_logo.png"
